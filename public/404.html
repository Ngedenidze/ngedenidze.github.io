    <title>Nika Gedenidze</title>
    <script>
      // GitHub Pages SPA fallback: stash the requested path and bounce to the
      // app root, where index.html restores it via history.replaceState.
      sessionStorage.redirect = location.href
      location.replace(location.origin + '/')
    </script>
